# манифест звена «Кузнец». схема — ../SCHEMA.md
# пути repo — от корня репозитория. пути box — абсолютные на боксе Grok Bot.
schema_version: 1
link: kuznets
order_hint: 'первое звено конвейера; вход — API gosplan.info, выход — «Госзакупки/Сток»; оттуда загрузчик fatima/stock_docs_fetcher переносит папки в «Бланки», Фатима работает только из «Бланков»'
docs:
  readme: kuznets/README.md                   # роль, работа по шагам, особые случаи
  install: kuznets/INSTALL_BY_BOT.md          # установка ботом, по шагам
  setup: kuznets/SETUP.md                     # установка человеком
  format: kuznets/FORMAT.md                   # формат папки тендера

bot:
  name: Кузнец
  title: Сканер госзакупок — первое звено конвейера
  description: Находит новые тендеры через gosplan.info и кладёт их папками в Google Drive «Госзакупки/Сток». Сопровождает сканер и инструменты конвейера, в том числе загрузчик fatima/stock_docs_fetcher. Другим ботам даёт инструменты, их роли не описывает.
  prompt_file: kuznets/bot/prompt.md          # весь файл = системный промт, вставлять как есть
  placeholders:                               # заменить в prompt_file при создании
    "<id Тэндер Мэна>": {bot: Тэндер Мэн, note: подставить id при создании}
    "<id Фатимы>": {bot: Фатима, note: подставить id при создании}
    "<id Скрипты и интеграции>": {bot: Скрипты и интеграции, note: подставить id при создании}

teammates:                                    # только по имени. id подставить при создании
  - name: Тэндер Мэн
    relation: 'глава команды конвейера; получает отчёты и эскалирует владельцу'
  - name: Фатима
    relation: 'следующее звено; работает только из «Госзакупки/Бланки». из «Сток» в «Бланки» папки переносит загрузчик fatima/stock_docs_fetcher, его сопровождает Кузнец. роль Фатимы описана в fatima/'
  - name: Скрипты и интеграции
    relation: 'исполнитель правок кода по заказу Кузнеца'
  # бота ещё нет — оставить имя в промте, id дописать после его создания

routines:
  - name: Утренний скан госзакупок
    cron: "0 7 * * *"
    timezone: 'часовой пояс бокса (проверить `date`); на старом боксе Asia/Krasnoyarsk, UTC+7. время подтверждает владелец'
    prompt_file: kuznets/bot/routine_prompt.md  # весь файл = промт рутины
    command: cd /home/box/gosplan/scripts && ../.venv/bin/python gosplan_drain.py daily
    enable: last                                # включать после verification и first_run.preconditions
  - name: Почасовая проверка добора
    cron: "0 * * * *"
    timezone: 'часовой пояс бокса'
    prompt_file: kuznets/bot/routine_hourly_prompt.md
    command: cd /home/box/gosplan/scripts && ../.venv/bin/python gosplan_drain.py status
    enable: last

deploy:
  - from: kuznets/scripts/gosplan_scanner.py
    to: /home/box/gosplan/scripts/gosplan_scanner.py
  - from: kuznets/scripts/gosplan_lib.py
    to: /home/box/gosplan/scripts/gosplan_lib.py
  - from: kuznets/scripts/gosplan_drain.py
    to: /home/box/gosplan/scripts/gosplan_drain.py
  - from: kuznets/scripts/drain_start.sh
    to: /home/box/gosplan/scripts/drain_start.sh
    mode: "755"
  - from: kuznets/scripts/config.novosibirsk.yaml
    to: /home/box/gosplan/scripts/config.novosibirsk.yaml
  - from: kuznets/scripts/config.example.yaml
    to: /home/box/gosplan/scripts/config.example.yaml
  - from: kuznets/scripts/README.md
    to: /home/box/gosplan/scripts/README.md
  - from: kuznets/state/export_00cd167b09dc.json
    to: /home/box/gosplan/scripts/state/export_00cd167b09dc.json
    when: 'до первого запуска; файл на боксе уже есть — не затирать'
  # не создавать вручную: scripts/logs — сканер создаёт сам

drain:                                          # добор очереди pending по одной закупке
  script: /home/box/gosplan/scripts/gosplan_drain.py
  start: /home/box/gosplan/scripts/drain_start.sh
  status: cd /home/box/gosplan/scripts && ../.venv/bin/python gosplan_drain.py status
  step: gosplan_scanner.py -c config.novosibirsk.yaml --remote 'gosplan:Госзакупки/Сток' --limit 1
  interval: 'DRAIN_INTERVAL, 30 с старт-к-старту'
  backoff: 'DRAIN_BACKOFF, 300 с после кода не 0/3 или прогона без движения очереди'
  stops: 'очередь пуста; при пустой очереди сканер не вызывается (иначе --limit 1 начал бы новый поиск)'
  lock: 'state/kuznets_run.lock (flock); общий для добора и утреннего прогона daily'
  status_file: state/drain_status.json
  log: logs/drain.log
  autostart: 'systemd и cron на боксе нет; добор — отсоединённый процесс (новая сессия). после перезагрузки бокса его поднимает почасовая рутина'

post_install:                                   # после verification, до включения рутин
  - 'реестр kuznets/state/export_00cd167b09dc.json скопирован в /home/box/gosplan/scripts/state/ (deploy)'
  - 'cd /home/box/gosplan/scripts && ../.venv/bin/python gosplan_drain.py status — pending > 0'
  - 'cd /home/box/gosplan/scripts && ./drain_start.sh — добор запущен'
  - 'через 2–3 минуты status: exported_last_hour растёт, drain_status.last_error = null'

dependencies:
  python:
    min_version: "3.10"
    venv: /home/box/gosplan/.venv
    create: python3 -m venv /home/box/gosplan/.venv
    packages: [pyyaml]
    install: /home/box/gosplan/.venv/bin/pip install pyyaml
  rclone:
    version: "1.75.2"                          # проверенная версия; новее — допустимо
    install: curl https://rclone.org/install.sh | sudo bash
    check: rclone version
    remote_name: gosplan
    remote_shared: 'remote gosplan: общий для всех ботов владельца на боксе; ~/.config/rclone/rclone.conf в репозиторий не класть'
    oauth_app: 'проект gosplan-rclone, In production с 29.10.2026; refresh-токен без 7-дневного срока'

config:
  file: /home/box/gosplan/scripts/config.novosibirsk.yaml
  current:
    region: 54
    delivery_city: Новосибирск                 # только пометка, не отсев
    price_min: 30000
    price_max: 150000
    stage: 1
    kinds: [zk, auction]
    laws: [44, 223]
    base_url: https://v2test.gosplan.info      # тест, без ключа
  owner: Кузнец                                # параметры меняет только Кузнец

secrets:                                       # просить у владельца. значения в репозиторий не писать
  - name: GOOGLE_OAUTH_CLIENT_ID
    required: true
    purpose: 'свой OAuth-клиент Google (Desktop) для rclone'
    store: '/home/box/gosplan/.env (chmod 600) и rclone.conf'
    how: 'owner_steps.oauth_client'
  - name: GOOGLE_OAUTH_CLIENT_SECRET
    required: true
    purpose: 'секрет того же OAuth-клиента'
    store: '/home/box/gosplan/.env (chmod 600) и rclone.conf'
    how: 'owner_steps.oauth_client'
  - name: GOSPLAN_API_KEY
    required: false
    purpose: 'ключ прод-сервера v2.gosplan.info; без него работает тест v2test'
    store: 'поле api_key в config.novosibirsk.yaml на боксе (сканер читает ключ только оттуда); base_url сменить на https://v2.gosplan.info'
    how: 'владелец получает в t.me/gosplan_project'
  - name: старый реестр выгрузки
    required: false
    purpose: 'не выгрузить повторно тендеры, которые прежний Кузнец уже положил в тот же «Сток»; перенесённая копия — kuznets/state/export_00cd167b09dc.json'
    file: state/export_00cd167b09dc.json        # имя = sha1 строки 'gosplan:Госзакупки/Сток'[:12]
    secret: false                               # только публичные номера тендеров
    how: 'first_run.preconditions'

connectors:
  - name: Google Drive
    required: true
    account: аккаунт Google, владеющий папкой «Госзакупки»
    purpose: 'проверить и создать раскладку drive_layout; смотреть «Сток»'
  - name: GitHub
    required: false
    purpose: 'репозиторий публичный, хватает git clone'

drive_layout:                                  # id папок не хардкодить
  account: аккаунт Google, владеющий папкой «Госзакупки»
  root: Госзакупки
  folders: [Сток, Бланки]
  rule: 'есть — использовать как есть; нет — создать. «Сток» не пересоздавать и не чистить'
  rclone_paths:
    stock: gosplan:Госзакупки/Сток
    test: gosplan:Госзакупки/_проверка_кузнеца

owner_steps:
  oauth_client:
    why: 'общий client_id rclone выводится из оборота; нужен свой OAuth-клиент'
    options:
      - id: existing
        say: "Для Кузнеца нужен OAuth-клиент Google для rclone. Есть готовый (проект gosplan-rclone, приложение опубликовано, In production). Пришлите его client_id и client_secret как секреты."
      - id: new
        say: "Для Кузнеца нужен OAuth-клиент Google для rclone. Создайте его в любом Google-аккаунте: console.cloud.google.com → новый проект → APIs & Services → Library → Google Drive API → Enable; OAuth consent screen → External, homepage и privacy policy: https://github.com/milordasceo/tender-conveyor → Publish app (In production); Credentials → Create credentials → OAuth client ID → Desktop app. Пришлите client_id и client_secret как секреты."
  google_cloud_terms:
    say: "Google Cloud попросит принять условия использования при первом входе в консоль. Это делаете вы, я не могу."
  rclone_authorize:
    say: "Откройте мой рабочий стол (бокс) и войдите в Google аккаунтом, владеющим папкой «Госзакупки». Окно входа уже открыто. Нажмите «Разрешить». Если Google пишет, что приложение не проверено, — «Дополнительно» → «Перейти»."
    bot_does: "rclone config create gosplan drive scope=drive client_id=$GOOGLE_OAUTH_CLIENT_ID client_secret=$GOOGLE_OAUTH_CLIENT_SECRET — в фоне; ссылку http://127.0.0.1:53682/auth?... из вывода открыть в браузере бокса; ждать завершения команды"
  old_registry:
    say: "Реестр выгрузки прежнего Кузнеца уже в репозитории (kuznets/state, выгружено 5, в очереди 515 на 29.10.2026). Остановите рутины прежнего Кузнеца и его фоновую выгрузку, если она есть: два Кузнеца на один «Сток» дадут дубли. Подтвердите, когда остановлено."
  confirm_schedule:
    say: "Рутины Кузнеца: «Утренний скан госзакупок» каждый день в 07:00 и «Почасовая проверка добора» каждый час в :00, по времени бокса (<часовой пояс>). Подтвердите или назовите другое время утреннего скана."

verification:
  state_dir: /tmp/kuznets_check                # временный реестр; боевой не трогается
  test_remote: gosplan:Госзакупки/_проверка_кузнеца
  steps:
    - cmd: rclone lsd gosplan:Госзакупки
      expect: 'видны Сток и Бланки'
    - cmd: md5sum /home/box/gosplan/scripts/state/export_00cd167b09dc.json
      expect: 'записать сумму; в конце сверить — боевой реестр не изменился'
    - cmd: cd /home/box/gosplan/scripts && GOSPLAN_STATE_DIR=/tmp/kuznets_check ../.venv/bin/python gosplan_scanner.py -c config.novosibirsk.yaml --dry-run
      expect: 'stdout "найдено: 0", "новых: 0", "выгружено: 0"; код 0; URL запросов в stderr'
    - cmd: |
        mkdir -p /tmp/kuznets_check && /home/box/gosplan/.venv/bin/python - <<'PY'
        import json
        d = json.load(open('/home/box/gosplan/scripts/state/export_00cd167b09dc.json', encoding='utf-8'))
        d['pending'] = d['pending'][:2]; d['remote'] = 'gosplan:Госзакупки/_проверка_кузнеца'
        json.dump(d, open('/tmp/kuznets_check/export_0ad93d739bc6.json', 'w', encoding='utf-8'), ensure_ascii=False)
        print(len(d['pending']))
        PY
      expect: '2 — тестовый реестр: копия боевого, 2 закупки в очереди, имя = sha1 тестового remote'
    - cmd: cd /home/box/gosplan/scripts && GOSPLAN_STATE_DIR=/tmp/kuznets_check ../.venv/bin/python gosplan_scanner.py -c config.novosibirsk.yaml --remote 'gosplan:Госзакупки/_проверка_кузнеца' --limit 1; echo "exit=$?"
      expect: 'stderr "pending не пуст — поиск пропущен, сначала добор", "pending: осталось 1"; stdout "найдено: 0", "новых: 0", "выгружено: 1"; exit=3'
      duration: '10–30 с'
    - cmd: cd /home/box/gosplan/scripts && GOSPLAN_STATE_DIR=/tmp/kuznets_check KUZNETS_REMOTE='gosplan:Госзакупки/_проверка_кузнеца' DRAIN_INTERVAL=5 ../.venv/bin/python gosplan_drain.py run; echo "exit=$?"
      expect: 'exit=0 (добор в переднем плане выгрузил последнюю и вышел); в logs/drain.log "pending 1 -> 0", "очередь пуста"'
    - cmd: cd /home/box/gosplan/scripts && GOSPLAN_STATE_DIR=/tmp/kuznets_check KUZNETS_REMOTE='gosplan:Госзакупки/_проверка_кузнеца' ../.venv/bin/python gosplan_drain.py status
      expect: 'pending 0; drain_running false; drain_status.state "done"; last_error null'
    - cmd: rclone lsf 'gosplan:Госзакупки/_проверка_кузнеца' --dirs-only
      expect: 'две папки <номер>/, в каждой tender.json и tender.md (kuznets/FORMAT.md)'
  cleanup:
    - rclone purge 'gosplan:Госзакупки/_проверка_кузнеца'
    - rm -rf /tmp/kuznets_check
    - cmd: md5sum /home/box/gosplan/scripts/state/export_00cd167b09dc.json
      expect: 'та же сумма, что до проверки'

first_run:
  preconditions:
    - verification пройдена, cleanup сделан
    - 'post_install выполнен, добор запущен'
    - «Сток» существующий не пересоздан
    - 'реестр из kuznets/state положен в /home/box/gosplan/scripts/state/ (INSTALL_BY_BOT.md, шаг 7, вариант 0); иначе вариант 1–3 оттуда же'
    - рутина прежнего Кузнеца остановлена
  notes:
    - перенесённый реестр несёт очередь pending (515 на 29.10.2026); её выгружает добор, по одной примерно раз в 30 с (~4–5 часов)
    - пока очередь не пуста, утренний прогон не ищет; первый поиск — утром после опустошения очереди, с даты last_completed_at минус 1 день
    - без реестра первый поиск берёт все подходящие тендеры (пустой last_completed_at = без фильтра даты публикации)
    - тестовый API часто отвечает 429; добор тогда идёт медленнее, это норма
    - папки, которые уже лежат в «Сток», сканер не копирует повторно (rclone lsf перед выгрузкой), но тратит на них запрос API
    - папки, которые Фатима уже унесла из «Сток», при пустом реестре выгрузятся снова
