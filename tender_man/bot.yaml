# манифест «Тэндер Мэн» — глава команды конвейера тендеров. схема — ../SCHEMA.md
# пути repo — от корня репозитория. пути box — абсолютные на боксе Grok Bot.
schema_version: 1
link: tender_man
order_hint: 'не звено конвейера, а глава команды: над всеми пятью звеньями (Кузнец → Фатима → Черри Пикер → Очкарик → Сисадмин); единственный, кто говорит с владельцем'
docs:
  readme: tender_man/README.md
  prompts: tender_man/prompts/                    # промты рутин отчётов

bot:
  name: Тэндер Мэн
  title: Глава команды конвейера тендеров
  description: Говорит с владельцем и надзирает за пятью звеньями конвейера — принимает их отчёты, даёт команды, эскалирует нештатное, присылает владельцу утренний и вечерний отчёт по CRM. Сам работу конвейера не делает.
  prompt_file: tender_man/bot/prompt.md           # весь файл = системный промт, вставлять как есть (после замены плейсхолдеров)
  placeholders:                                   # заменить в prompt_file при создании; реальные id в репозиторий не писать
    "<id Кузнеца>": {bot: Кузнец, note: подставить id при создании}
    "<id Фатимы>": {bot: Фатима, note: подставить id при создании}
    "<id Черри Пикера>": {bot: Черри Пикер, note: подставить id при создании}
    "<id Очкарика>": {bot: Очкарик, note: подставить id при создании}
    "<id Сисадмина>": {bot: Сисадмин, note: подставить id при создании}
    "<id Тэндер Мэна>": {bot: Тэндер Мэн, note: 'id самого бота; его же подставить в промты звеньев (ochkarik, sysadmin и др.)'}

teammates:                                        # только по имени
  - name: владелец (Станислав)
    relation: 'единственный собеседник снаружи команды: отчёты 09:00 и 21:00 Asia/Novosibirsk, ответы, эскалации; от него — команды, в т.ч. смена порога прибыли и цели дня'
  - name: Кузнец
    relation: 'звено 1: сканер → «Сток»; rclone remote gosplan:; репозиторий. отчитывается Тэндер Мэну, получает команды'
  - name: Фатима
    relation: 'звено 2: «Бланки» → разбор → «Цены/Новосибирск». отчитывается Тэндер Мэну, получает команды'
  - name: Черри Пикер
    relation: 'звено 3: цены.md → «К расчёту». отчитывается Тэндер Мэну, получает команды'
  - name: Очкарик
    relation: 'звено 4: рентабельность → «К рассмотрению» / «Нерентабельно». отчитывается Тэндер Мэну; ему передаётся смена порога прибыли (только по команде владельца)'
  - name: Сисадмин
    relation: 'звено 5: «К рассмотрению» → Notion «Тендеры», папка → «CRM». присылает по каждому тендеру в CRM номер, прибыль, ссылку; вечерний отчёт о цели дня; ему передаётся смена цели дня (только по команде владельца)'

routines:                                         # настраивает владелец; ниже — план
  - name: Утренний отчёт владельцу
    cron: "0 9 * * *"                             # в Grok Bot: CRON_TZ=Asia/Novosibirsk 0 9 * * *
    timezone: Asia/Novosibirsk
    timing: {mode: flexible, earlyMinutes: 0, lateMinutes: 15}
    prompt_file: tender_man/prompts/morning_report_prompt.md
    command: 'нет одной команды: чтение CRM (Notion «Тендеры») или сообщений Сисадмина, отчёт владельцу'
    enable: 'владелец создаёт рутину сам, после проверки'
  - name: Вечерний отчёт владельцу
    cron: "0 21 * * *"                            # в Grok Bot: CRON_TZ=Asia/Novosibirsk 0 21 * * *
    timezone: Asia/Novosibirsk
    timing: {mode: flexible, earlyMinutes: 0, lateMinutes: 15}
    prompt_file: tender_man/prompts/evening_report_prompt.md
    command: 'нет одной команды: итог дня по CRM и состояние звеньев, отчёт владельцу'
    enable: 'владелец создаёт рутину сам, после проверки'

deploy: []                                        # скриптов нет

dependencies:
  rclone:
    required: false
    remote_name: gosplan
    note: 'только если Тэндер Мэн сам смотрит Диск (только чтение: lsf, lsd, cat). remote настраивает Кузнец; конфиг rclone не читать и не трогать'

config:
  file: 'нет: правила — в bot/prompt.md и промтах рутин'
  current:
    profit_threshold_rub: 9000                    # порог Очкарика; менять только по явной команде владельца
    daily_goal: 10                                # цель Сисадмина; менять только по явной команде владельца
    goal_day: '09:00–09:00 Asia/Novosibirsk'
    crm: 'Notion: страница «К рассмотрению» (📋), база «Тендеры»; id не хардкодить — искать по названию'
    drive_root: 'gosplan:Госзакупки'
  owner: 'владелец; порог и цель дня Тэндер Мэн передаёт звеньям только по его явной команде'

secrets: []                                       # своих секретов нет

connectors:
  - name: Notion
    required: false
    account: рабочее пространство Notion владельца со страницей «К рассмотрению»
    purpose: 'только чтение базы «Тендеры» для отчётов. без коннектора — отчёты по сообщениям Сисадмина'

tools:                                            # новый ключ, см. «Пробелы схемы» в README
  - name: SendToAgent
    required: true
    purpose: 'сообщения пяти звеньям по id из placeholders'

owner_steps:
  connect_notion:
    why: 'для точных чисел в отчётах (сколько ждут, сколько добавлено, самый выгодный)'
    say: "Для отчётов Тэндер Мэну нужен доступ на чтение к Notion — страница «К рассмотрению» с базой «Тендеры». Сейчас покажу карточку подключения Notion. Без неё буду считать по сообщениям Сисадмина."
    bot_does: 'показать карточку подключения Notion; после входа — search «К рассмотрению», fetch базы «Тендеры» (только чтение)'
  routines:
    why: 'рутины отчётов настраивает владелец'
    say: "Создайте две рутины: «Утренний отчёт владельцу» — каждый день 09:00 по Новосибирску, текст — tender_man/prompts/morning_report_prompt.md; «Вечерний отчёт владельцу» — 21:00 по Новосибирску, текст — tender_man/prompts/evening_report_prompt.md."
    bot_does: 'дать владельцу тексты промтов'
  link_ids:
    why: 'звенья пишут Тэндер Мэну по id'
    say: "Тэндер Мэн создан. Его id надо подставить вместо <id Тэндер Мэна> в промты звеньев (Очкарик, Сисадмин и остальные). Подтвердите, что звенья обновлены."

verification:
  state_dir: 'нет: бот ничего не пишет на бокс'
  steps:
    - cmd: 'rg -n "<id " в вставленном системном промте'
      expect: 'пусто: все плейсхолдеры заменены реальными id'
    - cmd: 'SendToAgent каждому из пяти звеньев: «Проверка связи от Тэндер Мэна, ответь «на связи» и одной строкой — что сейчас во входной папке»'
      expect: 'пять ответов'
    - cmd: 'коннектор Notion (если подключён): search «К рассмотрению», fetch базы «Тендеры»'
      expect: 'база найдена, видны «Номер тендера», «Прибыль», createdTime. ничего не менять'
    - cmd: 'прогнать промт утреннего отчёта вручную, отправить владельцу с пометкой «тест»'
      expect: 'три числа: ждут рассмотрения, добавлено вчера, самый выгодный'
  cleanup: []

first_run:
  preconditions:
    - 'все пять звеньев созданы, их id подставлены в промт'
    - '<id Тэндер Мэна> подставлен в промты звеньев'
  notes:
    - 'прежний Тэндер Мэн (если есть) остановлен: два главы дважды пришлют отчёты и команды'
