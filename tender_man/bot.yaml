# манифест «Тэндер Мэн» — глава команды конвейера тендеров. схема — ../SCHEMA.md
# пути repo — от корня репозитория. пути box — абсолютные на боксе Grok Bot.
schema_version: 1
link: tender_man
order_hint: 'не звено конвейера, а глава команды: над всеми пятью звеньями (Кузнец → Фатима → Черри Пикер → Очкарик → Сисадмин); единственный, кто говорит с владельцем'
docs:
  readme: tender_man/README.md
  install: tender_man/INSTALL_BY_BOT.md             # пустой бот → Тэндер Мэн → остальные звенья → первичная настройка, по шагам
  prompts: tender_man/prompts/                    # промты рутин отчётов

bot:
  name: Тэндер Мэн
  title: Глава команды конвейера тендеров
  description: Говорит с владельцем и надзирает за пятью звеньями конвейера — принимает их отчёты, даёт команды, эскалирует нештатное, присылает владельцу утренний и вечерний отчёт по CRM. Сам работу конвейера не делает.
  prompt_file: tender_man/bot/prompt.md           # весь файл = системный промт, вставлять как есть (после замены плейсхолдеров)
  placeholders:                                   # заменить в prompt_file при создании; реальные id в репозиторий не писать
    "<id Кузнеца>": {bot: Кузнец, note: подставить id при создании}
    "<id Фатимы>": {bot: Фатима, note: подставить id при создании}
    "<id Черри Пикера>": {bot: Черри Пикер, note: подставить id при создании}
    "<id Очкарика>": {bot: Очкарик, note: подставить id при создании}
    "<id Сисадмина>": {bot: Сисадмин, note: подставить id при создании}
    "<id Тэндер Мэна>": {bot: Тэндер Мэн, note: 'id самого бота; его же подставить в промты звеньев (ochkarik, sysadmin и др.)'}

teammates:                                        # только по имени
  - name: владелец (Станислав)
    relation: 'единственный собеседник снаружи команды: отчёты 09:00 и 21:00 Asia/Novosibirsk, ответы, эскалации; от него — команды, в т.ч. смена порога прибыли и цели дня'
  - name: Кузнец
    relation: 'звено 1: сканер → «Сток»; rclone remote gosplan:; репозиторий. отчитывается Тэндер Мэну, получает команды'
  - name: Фатима
    relation: 'звено 2: «Бланки» → разбор → «Цены/Новосибирск». отчитывается Тэндер Мэну, получает команды'
  - name: Черри Пикер
    relation: 'звено 3: цены.md → «К расчёту». отчитывается Тэндер Мэну, получает команды'
  - name: Очкарик
    relation: 'звено 4: рентабельность → «К рассмотрению» / «Нерентабельно». отчитывается Тэндер Мэну; ему передаётся смена порога прибыли (только по команде владельца)'
  - name: Сисадмин
    relation: 'звено 5: «К рассмотрению» → Notion «Тендеры», папка → «CRM». присылает по каждому тендеру в CRM номер, прибыль, ссылку; вечерний отчёт о цели дня; ему передаётся смена цели дня (только по команде владельца)'

routines:                                         # создаёт Тэндер Мэн на этапе first_setup (пункт routines), владелец подтверждает карточку
  - name: Утренний отчёт владельцу
    cron: "0 9 * * *"                             # в Grok Bot: CRON_TZ=Asia/Novosibirsk 0 9 * * *
    timezone: Asia/Novosibirsk
    timing: {mode: flexible, earlyMinutes: 0, lateMinutes: 15}
    prompt_file: tender_man/prompts/morning_report_prompt.md
    command: 'нет одной команды: чтение CRM (Notion «Тендеры») или сообщений Сисадмина, отчёт владельцу'
    enable: 'first_setup, пункт routines: Тэндер Мэн создаёт, владелец одобряет на карточке подтверждения'
  - name: Вечерний отчёт владельцу
    cron: "0 21 * * *"                            # в Grok Bot: CRON_TZ=Asia/Novosibirsk 0 21 * * *
    timezone: Asia/Novosibirsk
    timing: {mode: flexible, earlyMinutes: 0, lateMinutes: 15}
    prompt_file: tender_man/prompts/evening_report_prompt.md
    command: 'нет одной команды: итог дня по CRM и состояние звеньев, отчёт владельцу'
    enable: 'first_setup, пункт routines: Тэндер Мэн создаёт, владелец одобряет на карточке подтверждения'

deploy: []                                        # скриптов нет

dependencies:
  rclone:
    required: false
    remote_name: gosplan
    note: 'только если Тэндер Мэн сам смотрит Диск (только чтение: lsf, lsd, cat). remote настраивает Кузнец; конфиг rclone не читать и не трогать'

config:
  file: 'нет: правила — в bot/prompt.md и промтах рутин'
  current:
    profit_threshold_rub: 9000                    # порог Очкарика; менять только по явной команде владельца
    daily_goal: 10                                # цель Сисадмина; менять только по явной команде владельца
    goal_day: '09:00–09:00 Asia/Novosibirsk'
    crm: 'Notion: страница «К рассмотрению» (📋), база «Тендеры»; id не хардкодить — искать по названию'
    drive_root: 'gosplan:Госзакупки'
  owner: 'владелец; порог и цель дня Тэндер Мэн передаёт звеньям только по его явной команде'

secrets: []                                       # своих секретов нет

connectors:
  - name: Notion
    required: false
    account: рабочее пространство Notion владельца со страницей «К рассмотрению»
    purpose: 'только чтение базы «Тендеры» для отчётов. без коннектора — отчёты по сообщениям Сисадмина'

tools:                                            # новый ключ, см. «Пробелы схемы» в README
  - name: SendToAgent
    required: true
    purpose: 'сообщения пяти звеньям по id из placeholders'

owner_steps:
  connect_notion:
    why: 'для точных чисел в отчётах (сколько ждут, сколько добавлено, самый выгодный)'
    say: "Для отчётов Тэндер Мэну нужен доступ на чтение к Notion — страница «К рассмотрению» с базой «Тендеры». Сейчас покажу карточку подключения Notion. Без неё буду считать по сообщениям Сисадмина."
    bot_does: 'показать карточку подключения Notion; после входа — search «К рассмотрению», fetch базы «Тендеры» (только чтение)'
  routines:
    why: 'рутины отчётов без подтверждения владельца не создаются'
    say: "Создаю две рутины: «Утренний отчёт владельцу» — каждый день 09:00 по Новосибирску и «Вечерний отчёт владельцу» — 21:00 по Новосибирску. Сейчас появится карточка подтверждения — одобрите каждую."
    bot_does: 'создать обе рутины из routines (CRON_TZ=Asia/Novosibirsk, промт — весь prompt_file), дождаться одобрения владельца на карточке'
  link_ids:
    why: 'звенья пишут Тэндер Мэну по id, друг другу — по id из своих placeholders'
    say: "Все звенья отчитались. Рассылаю им реальные id команды вместо плейсхолдеров <id …>; каждое подтвердит замену."
    bot_does: 'first_setup, пункт link_ids: каждому звену — реальные id ботов из его bot.placeholders; ждать «Id заменены» от всех пяти'

first_setup:                                      # этап «первичная настройка после создания ботов»; новый ключ, см. SCHEMA.md
  starts: 'когда созданы все пять звеньев'
  readiness_message: 'Готов: <имя звена>, мой id <id>, от владельца нужно: <список | ничего>'
  readiness_list: 'невыполненные owner_steps и connectors с required: true из папки звена'
  ping_after: '30 минут молчания после создания — напомнить звену; после второго напоминания — сказать владельцу'
  rule: 'пункты owner_checklist — по одному; следующий только после подтверждения владельца и done_when текущего. звено, чей шаг установки упёрся в шаг владельца, доделывает его сразу после нужного пункта и подтверждает'
  steps:
    - id: readiness
      who: все пять звеньев → Тэндер Мэн
      what: 'последний шаг INSTALL_BY_BOT каждого звена — readiness_message через SendToAgent; Тэндер Мэн ведёт чеклист «звено / отчёт / id / что нужно от владельца»'
      done_when: 'пять отчётов; id совпадают с полученными при создании'
    - id: link_ids
      who: Тэндер Мэн → звенья
      what: 'свой промт — id пяти звеньев; каждому звену — реальные id из его bot.placeholders; звено заменяет плейсхолдеры в промте, промтах рутин и памяти'
      done_when: 'пять ответов «Id заменены», rg -n "<id " пусто (кроме <id Скрипты и интеграции> у Кузнеца)'
  owner_checklist:
    - id: rclone_login
      who: Кузнец, владелец
      what: 'свежий box — oauth_client, затем rclone config create gosplan (kuznets owner_steps.rclone_authorize); remote есть, но 401/invalid_grant — rclone config reconnect gosplan: . в фоне, ссылка входа — в браузере бокса, Кузнец передаёт рабочий стол владельцу. входить аккаунтом Google, владеющим папкой «Госзакупки», не аккаунтом Cloud Console. OAuth-клиент — In production (kuznets/SETUP.md, раздел 6)'
      done_when: 'rclone lsd gosplan:Госзакупки видит Сток и Бланки; звенья доделали шаги Диска и verification'
    - id: loader
      who: владелец (Windows-ПК), сопровождает Кузнец
      what: 'fatima/stock_docs_fetcher: INSTALL.bat, затем STATUS.bat. Google Drive for desktop отдельно не проверять'
      done_when: 'STATUS.bat — работает; папки уходят из «Сток» в «Бланки»'
    - id: connectors
      who: владелец
      what: 'только из connectors в bot.yaml: Notion — Сисадмину обязательно, Тэндер Мэну по желанию; Google Drive — Кузнецу (required, аккаунт, владеющий «Госзакупки»). Gmail ни одно звено не требует — не подключать без слова владельца'
      done_when: 'Сисадмин доделал шаг Notion установки; у Тэндер Мэна Notion читается или «без Notion»'
    - id: roles
      who: Тэндер Мэн, владелец
      what: 'карточки-вопросы по одной на звено: что делает, вход → выход, кому отчитывается (bot.description, order_hint, teammates); «верно» / «поправить»; последняя — бот «Скрипты и интеграции»: создать или убрать'
      done_when: 'пять карточек подтверждены, поправки переданы звеньям и приняты'
    - id: routines
      who: каждое звено и Тэндер Мэн, владелец
      what: 'каждый создаёт рутины из своих routines, CRON_TZ=Asia/Novosibirsk, время — подтверждённое владельцем; владелец одобряет каждую на карточке подтверждения; Тэндер Мэн отмечает подтверждённые'
      done_when: 'все рутины всех звеньев и две рутины Тэндер Мэна созданы и подтверждены'
    - id: test_run
      who: все звенья → Тэндер Мэн
      what: 'прогон на живых данных без тестовых папок: Кузнец → загрузчик → Фатима → Черри Пикер → Очкарик → Сисадмин; каждый — одной строкой результат Тэндер Мэну; затем verification Тэндер Мэна (тестовый утренний отчёт)'
      done_when: 'все отчитались; итоговая сводка владельцу с последней строкой «Конвейер запущен»'
  live_when: 'readiness, link_ids и весь owner_checklist закрыты; до этого конвейер не считается запущенным'

verification:
  state_dir: 'нет: бот ничего не пишет на бокс'
  steps:
    - cmd: 'rg -n "<id " в вставленном системном промте'
      expect: 'пусто: все плейсхолдеры заменены реальными id'
    - cmd: 'SendToAgent каждому из пяти звеньев: «Проверка связи от Тэндер Мэна, ответь «на связи» и одной строкой — что сейчас во входной папке»'
      expect: 'пять ответов'
    - cmd: 'коннектор Notion (если подключён): search «К рассмотрению», fetch базы «Тендеры»'
      expect: 'база найдена, видны «Номер тендера», «Прибыль», createdTime. ничего не менять'
    - cmd: 'прогнать промт утреннего отчёта вручную, отправить владельцу с пометкой «тест»'
      expect: 'три числа: ждут рассмотрения, добавлено вчера, самый выгодный'
  cleanup: []

first_run:
  preconditions:
    - 'все пять звеньев созданы, отчитались о готовности, их id подставлены в промт'
    - 'реальные id разосланы звеньям, замена подтверждена (first_setup.link_ids)'
    - 'рутины отчётов — только в first_setup, пункт routines, с карточкой владельца'
  notes:
    - 'прежний Тэндер Мэн (если есть) остановлен: два главы дважды пришлют отчёты и команды'
