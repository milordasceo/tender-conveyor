# манифест звена «Сисадмин». схема — ../SCHEMA.md
# пути repo — от корня репозитория. пути box — абсолютные на боксе Grok Bot.
schema_version: 1
link: sysadmin
order_hint: 'звено после просчёта рентабельности; вход — «Госзакупки/К рассмотрению/<номер>» (tender.json, tender.md, цены.md), выход — карточка в базе Notion «Тендеры» на странице «К рассмотрению», затем папка тендера переносится в «Госзакупки/CRM»'
docs:
  readme: sysadmin/README.md                     # роль, структура базы Notion, правила полей
  install: sysadmin/INSTALL_BY_BOT.md            # установка ботом, по шагам
  example: sysadmin/examples/0151100007126000034 # вход (input/) и выход (card.md, properties.json)
  scripts: sysadmin/scripts/notion_card.py       # помощник: свойства и тело карточки из папки тендера

bot:
  name: Сисадмин
  title: Проверка папки «К рассмотрению» — звено конвейера тендеров
  description: Берёт рентабельные тендеры из «Госзакупки/К рассмотрению» на Диске, заводит по каждому карточку в базе Notion «Тендеры» (страница «К рассмотрению») — цена, прибыль, расходы, откуда забирать, куда везти, сроки и всё о закупке — и переносит папку тендера в «Госзакупки/CRM». Следит за целью дня и отчитывается Тэндер Мэну.
  prompt_file: sysadmin/bot/prompt.md            # весь файл = системный промт, вставлять как есть (после замены плейсхолдера)
  placeholders:                                  # заменить в prompt_file при создании
    "<id Кузнеца>": {bot: Кузнец, note: 'подставить id при создании; через него — вопросы по репозиторию'}
    "<id Тэндер Мэна>": {bot: Тэндер Мэн, note: 'подставить id при создании; ему — все сообщения Сисадмина: отчёт по каждому тендеру, проблемы, вопросы, цель дня'}

teammates:                                       # только по имени
  - name: владелец (Станислав)
    relation: 'в чат Сисадмина ему ничего не приходит (правило от 29.10.2026): все сообщения идут Тэндер Мэну. решает по карточкам в Notion; подключает Notion карточкой подключения; цель дня меняет только своей явной командой, её передаёт Тэндер Мэн'
  - name: Кузнец
    relation: 'настраивает и чинит rclone remote gosplan:; отвечает на вопросы по репозиторию и папке sysadmin/'
  - name: Тэндер Мэн
    relation: 'главный бот, единственный адресат сообщений Сисадмина. Сисадмин пишет ему: после каждого тендера, внесённого в Notion и перенесённого в Госзакупки/CRM/, — сразу номер, прибыль и ссылку на карточку Notion; проблемы с тендером или доступом (битые файлы, нет расчёта рентабельности, не читается Notion, rclone 401) и вопросы — сразу; сразу, когда за день (09:00–09:00 Asia/Novosibirsk) в «Тендеры» добавлено daily_goal тендеров (сейчас 5), — один раз в день; и всегда в 21:00 Asia/Novosibirsk — вечерний отчёт «выполнена / не выполнена: N из X» с номерами. новую цель дня Тэндер Мэн передаёт только по явной команде владельца — Сисадмин переходит на неё'
  - name: Очкарик
    relation: 'предыдущее звено; кладёт папки рентабельных тендеров в «К рассмотрению». связь только через папку'

routines:                                        # обе рутины включены
  - name: Проверка папки «К рассмотрению»
    cron: "0,30 * * * *"                         # в Grok Bot: CRON_TZ=Asia/Novosibirsk 0,30 * * * *
    timezone: Asia/Novosibirsk
    timing: {mode: flexible, earlyMinutes: 15, lateMinutes: 15}
    prompt_file: sysadmin/bot/routine_check_folder_prompt.md  # весь файл = промт рутины, дословно; тем же текстом — запуск по команде
    command: 'нет одной команды: перенос в Notion, moveto в «CRM», мгновенная проверка цели дня (раз в день, метка goal_sent/<дата>)'
    enable: 'включена, круглосуточно. создать включённой после verification'
  - name: Вечерний отчёт Тэндер Мэну
    cron: "0 21 * * *"                           # в Grok Bot: CRON_TZ=Asia/Novosibirsk 0 21 * * *
    timezone: Asia/Novosibirsk
    timing: {mode: flexible, earlyMinutes: 0, lateMinutes: 10}
    prompt_file: sysadmin/bot/routine_evening_report_prompt.md
    command: 'нет одной команды: подсчёт строк «Тендеры» с 09:00 Asia/Novosibirsk и отчёт Тэндер Мэну — всегда, выполнена цель или нет'
    enable: 'включена. создать включённой после verification'

deploy:
  - from: sysadmin/scripts/notion_card.py
    to: /home/box/sysadmin/scripts/notion_card.py
    mode: "755"
    when: 'шаг 4 INSTALL_BY_BOT.md'
    note: 'помощник; бот может работать и без него'
  - from: sysadmin/examples/0151100007126000034
    to: /home/box/sysadmin/examples/0151100007126000034
    when: 'шаг 4 INSTALL_BY_BOT.md'
    note: 'образец для проверки. рабочие папки создать пустыми: /home/box/sysadmin/{work,state/goal_sent}; /home/box/sysadmin/state/daily_goal = 5. уже есть — не затирать'

dependencies:
  python:
    min_version: "3.10"
    venv: 'не нужен: только стандартная библиотека'
    packages: []
  rclone:
    version: "1.75.2"                            # как у Кузнеца; новее — допустимо
    install: curl https://rclone.org/install.sh | sudo bash
    check: rclone version
    remote_name: gosplan
    note: 'нужен rclone remote gosplan: с доступом к Drive (настраивает Кузнец). конфиг rclone Сисадмин не читает и не трогает'

config:
  file: 'нет отдельного файла: правила — в bot/prompt.md и промтах рутин bot/routine_check_folder_prompt.md, bot/routine_evening_report_prompt.md'
  current:
    input: 'gosplan:Госзакупки/К рассмотрению'
    output: 'gosplan:Госзакупки/CRM/<номер> — папка переносится целиком (rclone moveto) после того, как строка в Notion есть; «CRM» = уже в Notion, не проверять'
    problem: 'нет расчёта рентабельности в tender.md или битые файлы — ничего не создавать, не переносить, сразу Тэндер Мэну'
    card_drive_line: 'Папка на Диске: Госзакупки / CRM / <номер>'
    city_level: 'нет; город — из tender.json delivery.city'
    notion_page: 'К рассмотрению (корень рабочего пространства, значок 📋)'
    notion_database: 'Тендеры (встроенная inline-база на странице «К рассмотрению»: таблица видна сразу)'
    profit: 'наибольшая «Прибыль варианта X» из tender.md'
    expenses: 'закупка + доставка + налог того же варианта из tender.md (сумма считается)'
    pickup: 'поставщик лучшего варианта из цены.md'
    destination: 'tender.json delivery.address + важное из notes / special_notes'
    other_fields: 'tender.json'
    duplicates: 'проверка по текстовому свойству «Номер тендера» (не по заголовку) перед созданием строки'
    work_dir: /home/box/sysadmin/work
    daily_goal: 5                                # тендеров к рассмотрению за день в «Тендеры»; меняется только по явной команде владельца, её передаёт Тэндер Мэн
    daily_goal_file: /home/box/sysadmin/state/daily_goal   # текущее значение; файла нет — 5
    daily_goal_day: '09:00–09:00 Asia/Novosibirsk (не календарный день бокса); дата дня = дата начала: TZ=Asia/Novosibirsk date -d "-9 hours" +%F'
    daily_goal_count: 'строки базы «Тендеры» с createdTime не раньше начала дня (<дата>T09:00:00+07:00)'
    daily_goal_notify: 'мгновенно, один раз за день — боту Тэндер Мэн, метка /home/box/sysadmin/state/goal_sent/<дата начала дня>; вечером в 21:00 Asia/Novosibirsk — всегда, без метки'
  owner: 'владелец; правила меняются только по его команде (правка системного промта и промтов рутин). daily_goal меняется только по явной команде владельца, её передаёт Тэндер Мэн'
  messaging: 'с 29.10.2026: владельцу в чат Сисадмина ничего не писать. все сообщения (отчёты, вопросы, проблемы с тендером и доступом) — только Тэндер Мэну <id Тэндер Мэна>. после каждого тендера, внесённого в Notion и перенесённого в CRM, — сразу номер, прибыль, ссылка на карточку'

secrets: []                                      # своих секретов нет. Notion — через коннектор (вход в карточке подключения), Диск — общий rclone remote gosplan: (Кузнец)

connectors:
  - name: Notion
    required: true
    account: рабочее пространство Notion владельца, где лежит страница «К рассмотрению»
    purpose: 'поиск страницы и базы, создание страниц-карточек, изменение свойств и раскладки базы (update_data_source), проверка дублей'
  - name: Google Drive
    required: false
    account: аккаунт Google, владеющий папкой «Госзакупки»
    purpose: 'не обязателен: вся работа с Диском через rclone'

drive_layout:                                    # id папок не хардкодить
  account: аккаунт Google, владеющий папкой «Госзакупки»
  root: Госзакупки
  folders:
    - К рассмотрению                             # вход: читать, забирать папки тендеров
    - CRM                                        # выход: папки тендеров, которые уже в Notion
  rule: 'файлы тендеров не менять, ничего не удалять. «К рассмотрению» не создавать. нет «CRM» — создать rclone mkdir (при установке; сейчас уже есть)'
  rclone_paths:
    in: 'gosplan:Госзакупки/К рассмотрению'
    crm: 'gosplan:Госзакупки/CRM'
    test: 'gosplan:Госзакупки/_проверка_сисадмина'

notion_layout:                                   # id страниц, баз и источников данных не хардкодить — искать по названию
  page: {title: К рассмотрению, icon: "📋", parent: корень рабочего пространства}
  database: {title: Тендеры, parent: К рассмотрению, inline: true, how: 'при создании отображать inline: notion-update-data-source с is_inline: true. база уже есть, но открывается ссылкой — тот же вызов'}
  title_rule: 'заголовок базы (title, кнопка «Открыть» карточки в таблице) — «Товар»; «Номер тендера» — обычное текстовое свойство: в таблице скрыто, в карточке первое в шапке. номер по-прежнему пишется в отчётах по тендеру и в сообщениях Тэндер Мэну; дубли ищутся по тексту «Номер тендера», не по заголовку'
  properties:                                    # в этом порядке
    - {name: Товар, type: title, source: 'обобщённое название товара по-русски, 1–3 слова («Перчатки», «Бумажные полотенца», «Полотенца и туалетная бумага»); предложение даёт scripts/notion_card.py по subject и items tender.json, бот может уточнить; заголовок карточки, в таблице — первая колонка с кнопкой «Открыть»'}
    - {name: Номер тендера, type: rich_text, source: 'tender.json number; ключ дедупликации; в таблице скрыт, в карточке — первым в шапке'}
    - {name: Полная цена, type: number, format: ruble, source: 'tender.json nmck.amount (НМЦК)'}
    - {name: Прибыль, type: number, format: ruble, source: 'tender.md: наибольшая «Прибыль варианта X»'}
    - {name: Расходы, type: number, format: ruble, source: 'tender.md: закупка + доставка + налог того же варианта'}
    - {name: Город, type: select, source: 'tender.json delivery.city'}
    - {name: Категория, type: select, options: {В городе: green, Загород: orange, С ограничениями: red}, source: 'tender.json category'}
    - {name: Количество поставок, type: rich_text, source: 'tender.json supply.deliveries_count'}
    - {name: Откуда забирать, type: rich_text, source: 'цены.md: поставщик лучшего варианта'}
    - {name: Куда везти, type: rich_text, source: 'tender.json delivery.address + notes'}
    - {name: '2ГИС: откуда', type: url, source: 'адрес поставщика лучшего варианта (только город, улица, дом) → ссылка 2ГИС, см. gis_link'}
    - {name: '2ГИС: куда', type: url, source: 'delivery.address (только город, улица, дом) → ссылка 2ГИС, см. gis_link'}
    - {name: Подача до, type: date, time: true, source: 'tender.json deadline.iso'}
    - {name: Предмет, type: rich_text, source: 'tender.json subject + количество'}
    - {name: Ссылка, type: url, source: 'tender.json url'}
    - {name: Чистая прибыль, type: formula, source: 'формула от «Прибыль» (см. profit_formula); не заполняется, считается сама'}
    - {name: Дней до подачи, type: formula, source: 'формула от «Подача до» (см. days_left_formula); не заполняется, считается сама'}
  profit_formula: 'if(empty(prop("Прибыль")), "", style(replaceAll(replaceAll(replaceAll(format(prop("Прибыль")), "([0-9])([0-9]{3})([.]|$)", "$1 $2$3"), "([0-9])([0-9]{3}) ", "$1 $2 "), "[.]", ",") + " ₽", "b", "green", "green_background"))'
  days_left_formula: 'if(empty(prop("Подача до")), empty(), dateBetween(prop("Подача до"), now(), "days"))'
  view:
    type: table
    sort: 'Подача до ASC'
    columns: [Товар, Чистая прибыль, Количество поставок, Дней до подачи, Подача до]   # видимые колонки, ровно в этом порядке
    configure: 'SHOW "Товар", "Чистая прибыль", "Количество поставок", "Дней до подачи", "Подача до"; SORT BY "Подача до" ASC'
    rule: 'вид таблицы «Тендеры» (единственный, Default view): видны только Товар (заголовок, кнопка «Открыть»), Чистая прибыль, Количество поставок, Дней до подачи, Подача до — в этом порядке; «Номер тендера» и остальные свойства в таблице скрыты, но не удаляются и в карточке остаются. отсортирован по «Подача до» по возрастанию — сверху меньше всего дней до подачи; «Подача до» у каждой карточки обязательно. SHOW заменяет весь набор видимых колонок — передавать весь список. HIDE не использовать'
    title_note: 'заголовок (title) Notion из таблицы не убирает — поэтому заголовок базы «Товар», он и стоит первым в SHOW. «Номер тендера» — текст, в SHOW не входит и в таблице не виден'

  profit_formula_note: 'прибыль в рублях жирным, зелёный текст на зелёной подложке (25 317,59 ₽) — чтобы бросалась в глаза в карточке на телефоне. number-свойства Notion стилизовать нельзя, поэтому формула. «Прибыль» (number) остаётся в базе для сортировки и сумм, в шапке карточки скрыта'
  gis_link:
    format: 'https://2gis.ru/<город латиницей>/geo/<id здания в 2ГИС>'   # карточка здания, без ?stat=
    lookup: 'GET https://2gis.ru/<город>/search/<адрес в URL-кодировке> (браузерный User-Agent, один запрос на адрес, пауза 1 с) → initialState.data.entity.profile: ровно одно type "building", номер дома совпал → id. Ключ API не нужен. Делает scripts/notion_card.py; --offline — без сети, --gis-ids — известные id'
    fallback: 'https://2gis.ru/<город латиницей>/search/<адрес в URL-кодировке>'   # если id не нашёлся
    city_slug: {Новосибирск: novosibirsk, Москва: moscow, Санкт-Петербург: spb, Томск: tomsk, Барнаул: barnaul, Кемерово: kemerovo}
    address: 'только «г. Город, ул. Улица, дом» — без названия компании, индекса, телефона, этажа, офиса, «(с подъёмом)» и примечаний'
    example: 'https://2gis.ru/novosibirsk/geo/141373143574119'   # г. Новосибирск, ул. Николая Островского, 49 к.1
  page_layout_header: [Номер тендера, Полная цена, Чистая прибыль, Расходы, Количество поставок, Откуда забирать, '2ГИС: откуда', Куда везти, '2ГИС: куда', Город, Категория, Подача до, Предмет, Ссылка]
  page_layout_hidden: [Прибыль]                  # в шапке скрыта (visibility: hide), в базе остаётся (в таблице тоже скрыта — см. view)
  page_layout: {main: [{type: cover}, {type: title}, {type: properties, properties: [{property: Номер тендера}, {property: Полная цена}, {property: Чистая прибыль}, {property: Расходы}, {property: Количество поставок}, {property: Откуда забирать}, {property: '2ГИС: откуда', visibility: hide_if_empty}, {property: Куда везти}, {property: '2ГИС: куда', visibility: hide_if_empty}, {property: Город}, {property: Категория}, {property: Подача до}, {property: Предмет}, {property: Ссылка}, {property: Прибыль, visibility: hide}, {property: Дней до подачи, visibility: hide_if_empty}]}, {type: editor}, {type: discussions}]}
  ddl: |                                         # в новой базе заголовок по умолчанию переименовать в «Товар» (RENAME COLUMN "<имя заголовка>" TO "Товар")
    ADD COLUMN "Полная цена" NUMBER FORMAT 'ruble'; ADD COLUMN "Прибыль" NUMBER FORMAT 'ruble'; ADD COLUMN "Расходы" NUMBER FORMAT 'ruble';
    ADD COLUMN "Город" SELECT('Новосибирск':blue); ADD COLUMN "Категория" SELECT('В городе':green, 'Загород':orange, 'С ограничениями':red);
    ADD COLUMN "Количество поставок" RICH_TEXT; ADD COLUMN "Откуда забирать" RICH_TEXT; ADD COLUMN "Куда везти" RICH_TEXT;
    ADD COLUMN "Подача до" DATE; ADD COLUMN "Предмет" RICH_TEXT; ADD COLUMN "Ссылка" URL;
    ADD COLUMN "2ГИС: откуда" URL; ADD COLUMN "2ГИС: куда" URL;
    ADD COLUMN "Чистая прибыль" FORMULA('if(empty(prop("Прибыль")), "", style(replaceAll(replaceAll(replaceAll(format(prop("Прибыль")), "([0-9])([0-9]{3})([.]|$)", "$1 $2$3"), "([0-9])([0-9]{3}) ", "$1 $2 "), "[.]", ",") + " ₽", "b", "green", "green_background"))');
    ADD COLUMN "Дней до подачи" FORMULA('if(empty(prop("Подача до")), empty(), dateBetween(prop("Подача до"), now(), "days"))');
    ADD COLUMN "Номер тендера" RICH_TEXT COMMENT 'Регистрационный номер закупки (ключ дедупликации)'
  card_sections: [Главное, 'Особые условия (+ Особые пометки)', Сроки, Что поставляем, Где купить, Расчёт рентабельности, Заказчик и закупка]
  card_highlights: 'в начале «Главное» — зелёный callout (color green_bg, 💰) с жирной строкой «Чистая прибыль: <сумма> ₽»; в строке «Прибыль» сумма жирно на зелёной подложке. рядом с адресами в «Главное» (откуда, куда) и «Где купить» (каждый поставщик) — ссылка «📍 2ГИС». в Notion жирный хранится как <b>…</b>, не **…**: перед правкой страницы — fetch и брать текст как есть'

owner_steps:
  connect_notion:
    why: 'Сисадмин пишет в Notion через коннектор; подключить его может только владелец'
    say: "Для Сисадмина нужен доступ к Notion. Сейчас покажу карточку подключения Notion — нажмите её и войдите в рабочее пространство, где должна быть страница «К рассмотрению». Дайте доступ к этой странице (или ко всему пространству, если страницы ещё нет — тогда я создам её сам)."
    bot_does: 'показать карточку подключения коннектора Notion; после входа — notion search «К рассмотрению»'
  rclone_ready:
    why: 'Сисадмин работает с Диском через общий rclone remote gosplan:, его настраивает Кузнец'
    say: "Для Сисадмина нужен rclone remote gosplan: с доступом к Google Диску (папка «Госзакупки»). Его настраивает Кузнец. Подтвердите, что Кузнец уже установлен и вход rclone сделан, или попросите Кузнеца это сделать."
    bot_does: "проверка: rclone lsf 'gosplan:Госзакупки' — видны К рассмотрению/ и CRM/. конфиг rclone не открывать"
  test_card:
    say: "Для проверки создам в Notion тестовую страницу «_проверка_сисадмина» с образцом карточки тендера 0151100007126000034 и потом уберу её в корзину. Базу «Тендеры» не трогаю. Разрешаете?"
  test_folder:
    say: "Для проверки переноса создам на Диске тестовую папку «Госзакупки/_проверка_сисадмина», положу туда образец тендера, перенесу его внутри тестовой папки в её «CRM» и затем удалю тестовую папку. Боевые «К рассмотрению» и «CRM» не трогаю. Разрешаете?"
  old_bot:
    say: "Если прежний Сисадмин ещё работает, остановите его рутины: два бота на одну «К рассмотрению» создадут дубли в Notion и дважды напишут Тэндер Мэну. Подтвердите, когда остановлено."

verification:
  state_dir: /tmp/sysadmin_check                 # локально; боевые «К рассмотрению», «CRM» и база «Тендеры» только читаются
  test_remote: 'gosplan:Госзакупки/_проверка_сисадмина'
  steps:
    - cmd: python3 /home/box/sysadmin/scripts/notion_card.py /home/box/sysadmin/examples/0151100007126000034/input --summary
      expect: 'прибыль 25 317,59 ₽ (вариант А), расходы 15 467,81 ₽, НМЦК 40 785,40 ₽; откуда — «Промышленная Площадка», ул. Николая Островского, 49 к.1; строки «2ГИС откуда/куда» — ссылки https://2gis.ru/novosibirsk/search/… на «г. Новосибирск, ул. Николая Островского, 49 к.1» и «г. Новосибирск, ул. Богдана Хмельницкого, д.104» (curl -o /dev/null -w %{http_code} → 200)'
      duration: '< 1 с'
    - cmd: rclone lsf 'gosplan:Госзакупки'
      expect: 'видны К рассмотрению/ и CRM/ (CRM нет — создать: rclone mkdir gosplan:Госзакупки/CRM)'
    - cmd: |
        mkdir -p /tmp/sysadmin_check && N=$(rclone lsf --dirs-only 'gosplan:Госзакупки/К рассмотрению' | head -1 | tr -d /) &&
        rclone copy "gosplan:Госзакупки/К рассмотрению/$N" "/tmp/sysadmin_check/$N" --include 'tender.*' --include 'цены.md' &&
        python3 /home/box/sysadmin/scripts/notion_card.py "/tmp/sysadmin_check/$N" --summary
      expect: 'сводка по живому тендеру без ошибок (или «К рассмотрению» пуста — шаг пропустить). только чтение'
      duration: '5–20 с'
    - cmd: TZ=Asia/Novosibirsk date -d '-9 hours' +%F
      expect: 'дата начала текущего дня цели (до 09:00 по Новосибирску — вчерашняя)'
    - cmd: |
        rclone copy /home/box/sysadmin/examples/0151100007126000034/input "gosplan:Госзакупки/_проверка_сисадмина/К рассмотрению/0151100007126000034" &&
        rclone mkdir 'gosplan:Госзакупки/_проверка_сисадмина/CRM' &&
        rclone moveto "gosplan:Госзакупки/_проверка_сисадмина/К рассмотрению/0151100007126000034" "gosplan:Госзакупки/_проверка_сисадмина/CRM/0151100007126000034" &&
        rclone lsf -R 'gosplan:Госзакупки/_проверка_сисадмина'
      expect: 'с разрешения owner_steps.test_folder: в тестовой CRM/0151100007126000034/ — tender.json, tender.md, цены.md; в тестовой «К рассмотрению» номера нет'
      duration: '10–30 с'
    - cmd: 'коннектор Notion: search «К рассмотрению», fetch базы «Тендеры»'
      expect: 'страница и база найдены, свойства (с «Чистая прибыль», «2ГИС: откуда», «2ГИС: куда») и раскладка как в notion_layout.page_layout. нет — создать их (это рабочая структура, не тест)'
    - cmd: 'коннектор Notion (с разрешения owner_steps.test_card): create page «_проверка_сисадмина» в корне, тело — examples/0151100007126000034/card.md; fetch'
      expect: 'страница открывается, разделы Главное … Заказчик и закупка на месте, строка «Папка на Диске: Госзакупки / CRM / 0151100007126000034»'
  cleanup:
    - cmd: rclone purge 'gosplan:Госзакупки/_проверка_сисадмина'
      note: 'только тестовая папка, созданная проверкой; владелец разрешает при установке (owner_steps.test_folder). боевые папки не удалять'
    - cmd: 'коннектор Notion: delete pages «_проверка_сисадмина» (в корзину)'
      note: 'только тестовая страница, созданная проверкой; базу «Тендеры» и её строки не трогать'
    - rm -rf /tmp/sysadmin_check

first_run:
  preconditions:
    - verification пройдена, cleanup сделан (или тестовые шаги пропущены без разрешения — так и записано в отчёте)
    - 'Notion подключён, страница «К рассмотрению» и база «Тендеры» есть'
    - "rclone lsf 'gosplan:Госзакупки' — видны К рассмотрению/ и CRM/"
    - 'прежний Сисадмин (если есть) остановлен (owner_steps.old_bot)'
    - '/home/box/sysadmin/state/daily_goal есть (5, если цель не менялась)'
  notes:
    - 'первый перенос: в «К рассмотрению» могут лежать несколько тендеров — карточки создаются по одному, с проверкой дублей, и папки уходят в «CRM»'
    - 'новых тендеров нет — рутина переноса молчит; вечерний отчёт Тэндер Мэну уходит всегда'
