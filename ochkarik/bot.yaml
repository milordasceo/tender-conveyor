# манифест звена «Очкарик». схема — ../SCHEMA.md
# пути repo — от корня репозитория. пути box — абсолютные на боксе Grok Bot.
schema_version: 1
link: ochkarik
order_hint: 'звено просчёта рентабельности; вход — «Госзакупки/К расчёту/<номер>» (tender.md + цены.md), выход — «Госзакупки/К рассмотрению» или «Госзакупки/Нерентабельно» с расчётом в tender.md'
docs:
  readme: ochkarik/README.md                     # роль, порядок работы, особые случаи
  install: ochkarik/INSTALL_BY_BOT.md            # установка ботом, по шагам
  example: ochkarik/examples/0151100007126000034  # вход (цены.md) и выход (tender.md с расчётом)
  scripts: ochkarik/scripts/calc.py              # расчёт для проверки; промт от него не зависит

bot:
  name: Очкарик
  title: Просчёт рентабельности — звено конвейера тендеров
  description: Берёт тендеры из «Госзакупки/К расчёту», по ценам из цены.md считает прибыль вариантов А и Б (закупка, доставка, налог — до 31.12.2026 — УСН «Доходы» 6% от выручки, с 01.01.2027 — УСН 15% от (выручка − закупка − доставка)), дописывает расчёт в tender.md и переносит папку в «К рассмотрению» (прибыль от 15 000 ₽) или в «Нерентабельно».
  prompt_file: ochkarik/bot/prompt.md            # весь файл = системный промт, вставлять как есть
  placeholders:
    '<id Тэндер Мэна>': 'id бота «Тэндер Мэн» на новом аккаунте'

teammates:                                       # только по имени
  - name: Черри Пикер
    relation: 'предыдущее звено; кладёт папки тендеров с цены.md в «К расчёту». связь только через папку'
  - name: Кузнец
    relation: 'настраивает и чинит rclone remote gosplan:. при 401 / invalid_grant Очкарик пишет Тэндер Мэну, повторный вход делает Кузнец'
  - name: Тэндер Мэн
    relation: 'глава команды; получает все отчёты, вопросы и проблемы Очкарика (SendToAgent, id — <id Тэндер Мэна>)'
  - name: владелец
    relation: 'забирает тендеры из «К рассмотрению»; в чат владельцу Очкарик не пишет'

routines:
  - name: 'Расчёт: папка «К расчёту»'
    cron: "*/30 * * * *"                          # в Grok Bot: CRON_TZ=Asia/Novosibirsk */30 * * * *
    timezone: Asia/Novosibirsk                  # единый пояс рутин конвейера; для */30 на время не влияет
    timing: {mode: flexible, earlyMinutes: 15, lateMinutes: 15}
    prompt_file: ochkarik/bot/routine_prompt.md  # весь файл = промт рутины, дословно
    command: 'нет одной команды: рутина идёт по шагам промта (rclone + расчёт)'
    enable: last                                 # после verification и подтверждения владельца (owner_steps.confirm_routine)

deploy:
  - from: ochkarik/scripts/calc.py
    to: /home/box/ochkarik/scripts/calc.py
    mode: "755"
    when: 'шаг 4 INSTALL_BY_BOT.md'
    note: 'не обязателен для работы: только для проверки расчёта'
  - from: ochkarik/examples/0151100007126000034
    to: /home/box/ochkarik/examples/0151100007126000034
    when: 'шаг 4 INSTALL_BY_BOT.md'
    note: 'образец для проверки. рабочие папки создать пустыми: /home/box/ochkarik/{work,state/в_работе}. уже есть — не затирать'

dependencies:
  python:
    min_version: "3.10"
    venv: 'не нужен: только стандартная библиотека'
    packages: []
  rclone:
    version: "1.75.2"                            # как у Кузнеца; новее — допустимо
    install: curl https://rclone.org/install.sh | sudo bash
    check: rclone version
    remote_name: gosplan
    note: 'нужен rclone remote gosplan: с доступом к Drive (настраивает Кузнец). конфиг rclone Очкарик не читает и не трогает'

config:
  file: 'нет отдельного файла: правила — в bot/prompt.md и bot/routine_prompt.md'
  current:
    input: 'gosplan:Госзакупки/К расчёту'
    output_profitable: 'gosplan:Госзакупки/К рассмотрению'
    output_unprofitable: 'gosplan:Госзакупки/Нерентабельно'
    city_level: 'сейчас нет; появится Госзакупки/<город>/… — работать через неё'
    per_run: 'все папки по одной, пока «К расчёту» не опустеет'
    profit_threshold_rub: 15000                  # с 31.10.2026 (раньше 9000)
    delivery_rub: {light: 1500, heavy_or_bulky: 3000, unknown: 3000}
    delivery_weight_limit_kg: 120
    tax: 'ИП, по дате расчёта: до 31.12.2026 — УСН «Доходы», 6% от выручки (НМЦК или вся максимальная сумма контракта); с 01.01.2027 — УСН «доходы минус расходы», 15% от (выручка − закупка − доставка), не меньше 0. режим указывать в расчёте'
    deposit: 'обеспечение заявки и контракта в расходы не входит, только упоминается'
  owner: 'владелец; правила меняются только по его команде (правка обоих промтов)'

secrets: []                                      # своих секретов нет. доступ к Drive — общий rclone remote gosplan: (Кузнец)

connectors:
  - name: Google Drive
    required: false
    account: аккаунт Google, владеющий папкой «Госзакупки»
    purpose: 'не обязателен: вся работа через rclone'

drive_layout:                                    # id папок не хардкодить
  account: аккаунт Google, владеющий папкой «Госзакупки»
  root: Госзакупки
  folders:
    - К расчёту                                  # вход (наполняют предыдущие звенья)
    - К рассмотрению                             # выход: рентабельно (забирает владелец)
    - Нерентабельно                              # выход: нерентабельно
  rule: 'есть — использовать как есть. нет «К рассмотрению» или «Нерентабельно» — создать rclone mkdir. «К расчёту» не создавать'
  rclone_paths:
    in: 'gosplan:Госзакупки/К расчёту'
    ok: 'gosplan:Госзакупки/К рассмотрению'
    no: 'gosplan:Госзакупки/Нерентабельно'
    test: 'gosplan:Госзакупки/_проверка_очкарика'

owner_steps:
  rclone_ready:
    why: 'Очкарик работает через общий rclone remote gosplan:, его настраивает Кузнец'
    say: "Для Очкарика нужен rclone remote gosplan: с доступом к Google Диску (папка «Госзакупки»). Его настраивает Кузнец. Подтвердите, что Кузнец уже установлен и вход rclone сделан, или попросите Кузнеца это сделать."
    bot_does: "проверка: rclone lsf 'gosplan:Госзакупки' — виден К расчёту/. конфиг rclone не открывать"
  test_folder:
    say: "Для проверки создам тестовую папку «Госзакупки/_проверка_очкарика», положу туда образец тендера, допишу расчёт, перенесу его внутри тестовой папки и затем удалю её. Боевые «К расчёту», «К рассмотрению» и «Нерентабельно» не трогаю. Разрешаете?"
  old_bot:
    say: "Если прежний Очкарик ещё работает, остановите его рутину: два бота на одну «К расчёту» допишут расчёт в tender.md дважды. Подтвердите, когда остановлено."
  confirm_routine:
    say: "Рутина Очкарика «Расчёт: папка «К расчёту»»: каждые 30 минут, гибко ±15 минут, Asia/Novosibirsk, круглосуточно. При пустой папке молчит. Включить сейчас?"

verification:
  state_dir: /tmp/ochkarik_check                 # всё локально; боевые папки Drive только читаются
  test_remote: 'gosplan:Госзакупки/_проверка_очкарика'
  steps:
    - cmd: |
        python3 /home/box/ochkarik/scripts/calc.py --nmck 40785,40 --delivery 1500 --line А=25,00x380 --line Б=32,20x380 --date 2027-01-01
        python3 /home/box/ochkarik/scripts/calc.py --nmck 40785,40 --delivery 1500 --line А=25,00x380 --line Б=32,20x380 --date 2026-12-31
      expect: 'с --date 2027-01-01 (15%): А 25 317,59 ₽, Б 22 991,99 ₽, рентабельно; с --date 2026-12-31 (6% от выручки): А 27 338,28 ₽, Б 24 602,28 ₽, рентабельно (порог 15 000 ₽)'
      duration: '< 1 с'
    - cmd: rclone lsf 'gosplan:Госзакупки'
      expect: 'виден К расчёту/ (К рассмотрению/ и Нерентабельно/ — если уже есть). только чтение'
    - cmd: rclone lsf --dirs-only 'gosplan:Госзакупки/К расчёту'
      expect: 'список номеров тендеров или пусто. ничего не пишет'
    - cmd: |
        mkdir -p /tmp/ochkarik_check/0151100007126000034 &&
        cp /home/box/ochkarik/examples/0151100007126000034/цены.md /tmp/ochkarik_check/0151100007126000034/ &&
        sed '/^## Расчёт рентабельности/,$d' /home/box/ochkarik/examples/0151100007126000034/tender.md > /tmp/ochkarik_check/0151100007126000034/tender.md &&
        rclone copy /tmp/ochkarik_check/0151100007126000034 "gosplan:Госзакупки/_проверка_очкарика/К расчёту/0151100007126000034" &&
        rclone lsf -R 'gosplan:Госзакупки/_проверка_очкарика'
      expect: 'в тестовой «К расчёту/0151100007126000034/» есть tender.md (без расчёта) и цены.md'
      duration: '5–20 с'
    - cmd: |
        cp /home/box/ochkarik/examples/0151100007126000034/tender.md /tmp/ochkarik_check/0151100007126000034/tender.md &&
        rclone copyto /tmp/ochkarik_check/0151100007126000034/tender.md "gosplan:Госзакупки/_проверка_очкарика/К расчёту/0151100007126000034/tender.md" &&
        rclone moveto "gosplan:Госзакупки/_проверка_очкарика/К расчёту/0151100007126000034" "gosplan:Госзакупки/_проверка_очкарика/К рассмотрению/0151100007126000034" &&
        rclone lsf -R 'gosplan:Госзакупки/_проверка_очкарика' &&
        rclone cat "gosplan:Госзакупки/_проверка_очкарика/К рассмотрению/0151100007126000034/tender.md" | grep -c 'Прибыль варианта'
      expect: 'папка в «К рассмотрению/0151100007126000034/» с tender.md и цены.md; в «К расчёту/» номера нет; grep — 2'
      duration: '10–30 с'
  cleanup:
    - cmd: rclone purge 'gosplan:Госзакупки/_проверка_очкарика'
      note: 'только эта тестовая папка, созданная проверкой; владелец разрешает при установке (owner_steps.test_folder). боевые папки не удалять'
    - rm -rf /tmp/ochkarik_check

first_run:
  preconditions:
    - verification пройдена, cleanup сделан (или тестовая часть на Диске пропущена без разрешения — так и записано в отчёте)
    - "rclone lsf 'gosplan:Госзакупки' — виден К расчёту/"
    - 'прежний Очкарик (если есть) остановлен'
    - владелец сказал включить рутину
  notes:
    - '«К расчёту» пуста — рутина молчит'
    - 'за прогон обрабатываются все папки по одной; проблемные остаются на месте и попадают в отчёт отдельно'
    - 'нет «К рассмотрению» или «Нерентабельно» — Очкарик создаёт их rclone mkdir при первом переносе'
