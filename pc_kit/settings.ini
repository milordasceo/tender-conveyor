; ============================================================
;  НАСТРОЙКИ  (одна копия на оба скрипта: сканер и загрузчик)
;  Строки, начинающиеся с ";", — комментарии, их можно не трогать.
;  После правки просто сохраните файл (Ctrl+S). Ничего пересобирать не нужно.
; ============================================================

[папки]
; Папка «Сток» — сюда сканер кладёт найденные тендеры.
; Это папка на диске Google Drive для ПК. Пример: G:\Мой диск\Госзакупки\Сток
сток = G:\Мой диск\Госзакупки\Сток
; Папка «Бланки» — сюда загрузчик кладёт скачанные документы тендеров.
бланки = G:\Мой диск\Госзакупки\Бланки
; Папка «Бланки» внутри копии DSH (Госзакупки/DSH/Бланки), рядом с основными «Бланки».
; Пусто = вычислить автоматически: папка-родитель основных «Бланки»\DSH\Бланки
; (для пути выше это G:\Мой диск\Госзакупки\DSH\Бланки).
; Тендеры по-прежнему берутся только из основного «Сток». Сток внутри DSH не читается и не пишется.
бланки_dsh =
; Каждый N-й успешно обработанный тендер (5, 10, 15…) кладётся в DSH/Бланки, остальные — в основные «Бланки».
; 0 = выключено, все тендеры идут в основные «Бланки».
; Счётчик лежит в state\dsh_counter.json и не сбрасывается между запусками.
каждый_n = 5

[поиск]
; Код региона (54 = Новосибирская область). Несколько — через запятую: 54, 42
регион = 54
; Город по месту поставки (пусто = вся область). Несколько — через запятую.
город = Новосибирск
; Ключевые слова в названии закупки, через запятую. Пусто = все закупки.
ключевые_слова =
; да = должны встретиться ВСЕ слова; нет = хотя бы одно
все_слова = нет
; Только поставка товара (купить и привезти). да = услуги, работы и аренда пропускаются.
; В названии должно встретиться хотя бы одно слово из «слова_поставки» (без учёта регистра).
только_поставка = да
; «поставк» подходит к «поставка», «поставки», «поставку», «поставке». Несколько — через запятую.
слова_поставки = поставк
; Стоп-фразы: если фрагмент есть в названии — пропуск, даже когда слово поставки нашлось.
; Поиск по подстроке без учёта регистра: «медицин» отсекает «Медицинский», «медицины».
; Пустая строка = не проверять. Несколько — через запятую.
стоп_слова = оказание услуг, выполнение работ, услуги по, работы по, аренда, ремонт, техническое обслуживание, медицин, лекарств, препарат, реактив, реагент, шприц, перевязоч, лаборатор, диагностик, стоматолог, ортопед, протез, медизделий, хирург, катетер, инфузион, тест-полоск, тест-полос, дезинфиц, стерилиз, стерильн, анализатор, глюкометр, глюкоз, рентген, маммограф, инъекц, бактерицид, облучател, эндоскоп, биопси, ларингеаль, плевральн, дренир, кювет, коагулометр, пациент, термоиндикатор, абсорбент, бактериальн, влагообменник, трехсекцион, ватн, мочевой, кдл, ивд, диаграммн, рециркулятор, вспомогательного назначения, подгузник
; Начальная цена, рубли: от и до
сумма_от = 30000
сумма_до = 150000
; Законы: 44, 223 или оба через запятую
законы = 44, 223
; Виды закупок: zk = запрос котировок, auction = аукцион (через запятую)
виды = zk, auction
; Окончание подачи заявок: от «сейчас + N дней» до «сейчас + M дней».
; Закупки без срока подачи не выгружаются; срок перепроверяется перед выгрузкой.
срок_от_дней = 3
срок_до_дней = 10
; Сколько тендеров выгружать за один запуск (0 = все найденные)
лимит = 0

[расписание]
; Во сколько ежедневно запускать сканер (ЧЧ:ММ)
сканер_время = 07:00
; Дополнительно запускать сканер каждые N минут (0 = не надо, только ежедневно)
сканер_каждые_минут = 0
; Как часто загрузчик проверяет папку «Сток», секунд
загрузчик_интервал_сек = 60
