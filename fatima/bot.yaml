# манифест звена «Фатима». схема — ../SCHEMA.md
# пути repo — от корня репозитория. пути box — абсолютные на боксе Grok Bot.
schema_version: 1
link: fatima
order_hint: 'второе звено; вход — «Госзакупки/Бланки» (папки тендеров с документами), выход — «Госзакупки/Цены/Новосибирск/<категория>» и счётчик для бота, который ищет цены'
docs:
  readme: fatima/README.md                      # роль, порядок работы, особые случаи
  install: fatima/INSTALL_BY_BOT.md             # установка ботом, по шагам
  scripts: fatima/scripts/README.md             # скрипты и команды
  schema: fatima/scripts/tender.schema.json     # схема tender.json после разбора
  example: fatima/examples/0151100007126000034  # образец результата
  fetcher: fatima/stock_docs_fetcher/README.md  # загрузчик документов Сток → Бланки (windows-пк, сопровождает Кузнец)

bot:
  name: Фатима
  title: Документовед конвейера тендеров
  description: Берёт из «Госзакупки/Бланки» тендеры с загруженными документами, читает все документы, переписывает tender.md и tender.json начисто для CRM и раскладывает папки в «Цены/Новосибирск» по категориям со счётчиком.
  prompt_file: fatima/bot/prompt.md             # весь файл = системный промт, вставлять как есть
  placeholders:                                 # заменить в prompt_file и в routines[].prompt_file; реальные id в репозиторий не писать
    "<id Тэндер Мэна>": {bot: Тэндер Мэн, note: 'подставить id при создании; ему — все сводки и проблемы Фатимы. есть в bot/prompt.md и bot/routine_prompt.md — заменить в обоих'}
  # других <id …> в промтах Фатимы нет: Кузнец и Черри Пикер упоминаются по имени, сообщений им Фатима не шлёт

teammates:                                      # только по имени
  - name: Кузнец
    relation: 'первое звено: кладёт тендеры в «Сток»; настраивает rclone remote gosplan: на боксе; сопровождает загрузчик stock_docs_fetcher'
  - name: Тэндер Мэн
    relation: 'глава команды; единственный адресат сводок и проблем Фатимы (SendToAgent, <id Тэндер Мэна>). владельцу в чат Фатима не пишет'
  - name: Черри Пикер
    relation: 'следующее звено (в промте Фатимы — «бот, который ищет цены»): забирает тендеры из «Цены/Новосибирск/В городе» и вычитает единицу в счётчике; делает ссылки 2ГИС «откуда забрать». связь только через папки и счётчик'
  - name: Сисадмин
    relation: 'CRM-бот: берёт ссылку 2ГИС «куда везти» из tender.json delivery.map_url (правило ссылок — его sysadmin/scripts/notion_card.py)'

routines:
  - name: Разбор тендеров из Бланков
    cron: "0,30 8-19 * * 1-5"                   # будни 08:00–19:30 каждые 30 минут
    timezone: Asia/Novosibirsk                  # в Grok Bot: CRON_TZ=Asia/Novosibirsk 0,30 8-19 * * 1-5 (рабочий день по Новосибирску). раньше был Europe/Berlin; окно подтверждает владелец
    timing: 'flexible, ±15 минут'
    prompt_file: fatima/bot/routine_prompt.md   # весь файл = промт рутины, дословно
    command: 'нет одной команды: рутина идёт по шагам системного промта (rclone + скрипты /home/box/fatima/scripts)'
    enable: 'после установки создать включённой и сразу сделать первый разбор (если прежняя Фатима остановлена)'

deploy:
  - from: fatima/scripts/check_ready.py
    to: /home/box/fatima/scripts/check_ready.py
    mode: "755"
  - from: fatima/scripts/extract_text.py
    to: /home/box/fatima/scripts/extract_text.py
    mode: "755"
  - from: fatima/scripts/dgis_link.py
    to: /home/box/fatima/scripts/dgis_link.py
    mode: "755"
    note: 'ссылка 2ГИС на адрес «куда привезти» → tender.json delivery.map_url'
  - from: fatima/scripts/validate_tender.py
    to: /home/box/fatima/scripts/validate_tender.py
    mode: "755"
  - from: fatima/scripts/render_md.py
    to: /home/box/fatima/scripts/render_md.py
    mode: "755"
  - from: fatima/scripts/counter.py
    to: /home/box/fatima/scripts/counter.py
    mode: "755"
  - from: fatima/scripts/tender.schema.json
    to: /home/box/fatima/scripts/tender.schema.json
  - from: fatima/scripts/selftest.sh
    to: /home/box/fatima/scripts/selftest.sh
    mode: "755"
  - from: fatima/scripts/README.md
    to: /home/box/fatima/scripts/README.md
  - from: fatima/examples/0151100007126000034
    to: /home/box/fatima/examples/0151100007126000034
    note: 'selftest.sh ищет образец в ../examples'
  # рабочие папки создать пустыми: /home/box/fatima/{work,txt,backup,state}. уже есть — не затирать

state_files:
  counter_copy: /home/box/fatima/state/счётчик.json
  reported_skipped: /home/box/fatima/state/reported_skipped.txt   # номера отложенных по сроку тендеров, уже названных в сводке; по номеру в строке. нет — создать пустым, есть — не затирать. номер дописывается после отправки сводки

dependencies:
  python:
    min_version: "3.10"
    venv: 'не нужен: только стандартная библиотека'
    packages: []
  network:
    purpose: 'dgis_link.py: один GET https://2gis.ru/<город>/search/<адрес> на адрес доставки, браузерный User-Agent, без ключа API'
    hosts: [2gis.ru]
    check: 'bash selftest.sh — проверки 2ГИС офлайн (фейковый HTML)'
  libreoffice:
    purpose: '.doc, .rtf, .odt, .xls(x) → текст (soffice --headless)'
    install: 'sudo apt-get install -y libreoffice-writer libreoffice-calc'
    check: soffice --version
  poppler-utils:
    purpose: '.pdf → текст (pdftotext)'
    install: 'sudo apt-get install -y poppler-utils'
    check: pdftotext -v
  rclone:
    version: "1.75.2"                            # как у Кузнеца; новее — допустимо
    install: curl https://rclone.org/install.sh | sudo bash
    check: rclone version
    remote_name: gosplan
    note: 'нужен rclone remote gosplan: с доступом к Drive. на новом аккаунте его настраивает Кузнец. конфиг rclone Фатима не читает и не трогает'

config:
  file: 'нет отдельного файла: правила — в bot/prompt.md'
  current:
    city: Новосибирск
    categories: [В городе, Загород, С ограничениями]
    restricted_rule: 'все тендеры с ограничениями — прямо в «С ограничениями», не в подпапки «Лицензии»/«Опыт»'
    special_notes: 'обязательное поле tender.json: подъём на этаж, разгрузка, часы доставки и т.п.; нет — пустой массив, в tender.md «нет»'
    counter: gosplan:Госзакупки/Цены/Новосибирск/счётчик.json
    map_url: 'обязательное поле tender.json delivery.map_url: ссылка 2ГИС только на адрес «куда привезти» — https://2gis.ru/<город>/geo/<id здания>, не нашлось — https://2gis.ru/<город>/search/<адрес>; без ?stat=. команда: python3 /home/box/fatima/scripts/dgis_link.py --tender /home/box/fatima/work/<номер>/tender.json. ссылки «откуда забрать» — Черри Пикер; Сисадмин берёт ссылку из delivery.map_url'
    supply_only: 'с 31.10.2026: в разбор только поставки (купить и привезти / забрать и доставить; доставка, разгрузка, подъём на этаж — тоже поставка, в особые пометки). монтаж — услуга (владелец 31.10.2026: «Такие тендеры как кондиционеры (имею ввиду то, что нужно их ещё и установить) нужно отбраковывать.»): если по ТЗ или контракту поставщик сам устанавливает, монтирует, подключает или вводит в эксплуатацию — отбраковать. сборка (в том числе мебели) — тоже отбраковать (владелец 31.10.2026: «Сборку тоже отбраковывать»). услуги, строительство, ремонт, работы, обслуживание, сборка, монтаж — не разбирать, счётчик не трогать, папку как есть в «Госзакупки/Не поставки» (создать, если нет); в сводке Тэндер Мэну — сколько ушло в «Не поставки» и причина (услуги, сборка или монтаж)'
    min_days_to_deadline: 3                     # с 31.10.2026: меньше 3 полных дней до окончания подачи или срок не найден — не разбирать, оставить в «Бланках», в сводку
    preferred_days_to_deadline: 4               # 4+ дней — разбирать первыми (по убыванию дней)
    deadline_time_zone: Asia/Novosibirsk        # UTC+7, дни считать по Новосибирску
    deadline_rule: 'фильтр срока — до проверки «только поставки»; папку «Просрочено» не создавать (решение владельца 31.10.2026: «Не переносить, просто не брать в работу» — оставить в «Бланках»); окончание подачи обязательно в tender.json deadline и tender.md'
    national_regime: 'с 31.10.2026, владелец: «Нацрежим: Ограничение закупок товаров, происходящих из иностранных государств (ст. 14 44-ФЗ, ПП РФ от 23.12.2024 № 1875); подтверждение — номер реестровой записи РПП/евразийского реестра или страна происхождения. Вот этот момент возможно тоже стоит брать во внимание. Чтобы отдавать приоритет продавцам таких товаров. И поле такое добавить в CRM. Типа соблюдается или нет.» всегда заполнять tender.json conditions.national_regime по извещению и строку «Нацрежим» в tender.md (render_md.py): что установлено (запрет, ограничение или преимущество), по какой статье и ПП, как подтверждать (номер реестровой записи РПП — российской промышленной продукции — или евразийского реестра, либо страна происхождения); нет нацрежима — «не установлен», непонятно — «нет данных», пустым не оставлять. Нацрежим сам по себе не причина отбраковки и не причина класть в «С ограничениями»: это ограничение на происхождение товара, а не на участника. схема требует поле, minLength 1'
    security: 'с 31.10.2026, владелец: «И в дальнейшем всегда фиксировать обеспечение». всегда заполнять tender.json conditions.application_security, conditions.contract_security, conditions.warranty_security: размер в % и/или рублях, способ, освобождения, антидемпинг — как в документах; не требуется — «не требуется», в документах данных нет — «нет данных», пустым не оставлять; в tender.md строки об обеспечении (render_md.py). схема tender.schema.json требует поля, minLength 1'
    counter_time_zone: Asia/Novosibirsk         # UTC+7, задано в counter.py, от часов бокса не зависит
  owner: 'владелец; правила категорий меняются только по его команде (правка bot/prompt.md)'

secrets: []                                     # своих секретов нет. доступ к Drive — общий rclone remote gosplan: (Кузнец)

connectors:
  - name: Google Drive
    required: false
    account: аккаунт Google, владеющий папкой «Госзакупки»
    purpose: 'не обязателен: вся работа через rclone. можно смотреть раскладку глазами'

drive_layout:                                   # id папок не хардкодить
  account: аккаунт Google, владеющий папкой «Госзакупки»
  root: Госзакупки
  folders:
    - Бланки                                    # вход (наполняет загрузчик)
    - Цены/Новосибирск/В городе
    - Цены/Новосибирск/Загород
    - Цены/Новосибирск/С ограничениями
    - Не поставки                               # тендеры не на поставку, папка как есть, без счётчика
  not_touch: [Сток]
  rule: 'есть — использовать как есть; нет — создать rclone mkdir (папки «Цены/...» и «Не поставки»). «Бланки» и «Сток» не создавать и не чистить: их ведут Кузнец и загрузчик'
  rclone_paths:
    blanki: gosplan:Госзакупки/Бланки
    prices: gosplan:Госзакупки/Цены/Новосибирск
    counter: gosplan:Госзакупки/Цены/Новосибирск/счётчик.json
    not_supply: gosplan:Госзакупки/Не поставки

owner_steps:
  rclone_ready:
    why: 'Фатима работает через общий rclone remote gosplan:, его настраивает Кузнец'
    say: "Для Фатимы нужен rclone remote gosplan: с доступом к Google Диску (папка «Госзакупки»). Его настраивает Кузнец. Подтвердите, что Кузнец уже установлен и вход rclone сделан, или попросите Кузнеца это сделать."
    bot_does: 'проверка: rclone lsd gosplan:Госзакупки — видны Бланки и Цены. конфиг rclone не открывать'
  confirm_routine:
    say: "Рутина Фатимы «Разбор тендеров из Бланков»: по будням с 08:00 до 19:30 каждые 30 минут (±15 минут) по Новосибирску (Asia/Novosibirsk). Она создана и включена, первый разбор сделан."

verification:
  state_dir: /tmp/fatima_check                  # всё локально; боевые папки Drive только читаются
  note: 'тестовую папку на Диске не создавать, тестовый перенос и очистку (purge) не делать; перенос и счётчик проверяет первый боевой разбор'
  steps:
    - cmd: bash /home/box/fatima/scripts/selftest.sh
      expect: 'последняя строка «selftest: всё прошло», код 0. без rclone'
      duration: '5–15 с'
    - cmd: rclone lsd gosplan:Госзакупки
      expect: 'видны Бланки и Цены (только чтение)'
    - cmd: rclone lsf -R --dirs-only 'gosplan:Госзакупки/Цены/Новосибирск' | python3 /home/box/fatima/scripts/counter.py count
      expect: 'JSON с тремя категориями; сверить с rclone cat счётчика (если он есть). ничего не пишет'
    - cmd: |
        rclone lsf --dirs-only 'gosplan:Госзакупки/Бланки' | head -3 | while read d; do
          rclone cat "gosplan:Госзакупки/Бланки/${d}docs_status.json" | python3 /home/box/fatima/scripts/check_ready.py --status-file -; done
      expect: 'строки «<номер> ready|not_ready ...»; пустые «Бланки» — нет строк. ничего не пишет'
  cleanup:
    - rm -rf /tmp/fatima_check

first_run:
  preconditions:
    - verification пройдена
    - 'rclone lsd gosplan:Госзакупки/Цены/Новосибирск — видны «В городе», «Загород», «С ограничениями»'
    - 'прежняя Фатима (если есть) остановлена: две Фатимы на одни «Бланки» дадут двойной +1 в счётчике'
  notes:
    - 'сразу после установки — первый разбор «Бланков», не дожидаясь расписания'
    - 'пустые «Бланки» — рутина молчит'
    - 'тендеры с docs_status.state = pending пропускаются молча до следующего запуска'
    - 'счётчик.json уже есть на Диске после прежней Фатимы — не пересоздавать, только +1'
